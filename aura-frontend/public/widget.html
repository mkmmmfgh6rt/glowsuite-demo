<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17100d" />

  <title>GlowSuite AI – A.U.R.A.</title>

  <link rel="stylesheet" href="/fonts/Inter.css" />

  <style>
    /* =========================================================
       GLOWSUITE AI – WIDGET V2
       Premium Conversational Booking Experience
    ========================================================= */

    :root {
      --page-bg: #16100d;

      --surface: #fffdf9;
      --surface-soft: #faf5ee;
      --surface-warm: #f4eadf;

      --text: #33251f;
      --text-soft: #705e54;
      --text-faint: #9c8b80;

      --espresso: #241812;
      --espresso-soft: #38261e;

      --gold: #c89b5d;
      --gold-light: #e4c38d;
      --bronze: #a96e49;

      --line: rgba(112, 81, 62, 0.14);
      --line-strong: rgba(172, 124, 76, 0.28);

      --success: #73926f;

      --botBubble: #fffdf9;
      --botBorder: rgba(157, 115, 74, 0.18);

      --userBubbleFrom: #4b3328;
      --userBubbleTo: #2d1e18;

      --brand: #c89b5d;
      --brandDark: #9d653e;

      --shadow-lg:
        0 32px 80px rgba(18, 10, 6, 0.35),
        0 8px 24px rgba(18, 10, 6, 0.14);

      --shadow-md:
        0 10px 30px rgba(43, 27, 19, 0.10);

      --radius-xl: 30px;
      --radius-lg: 20px;
      --radius-md: 15px;
      --radius-sm: 11px;
    }

    /* =========================================================
       DARK MODE
    ========================================================= */

    :root[data-theme="dark"] {
      --page-bg: #090706;

      --surface: #171311;
      --surface-soft: #1e1916;
      --surface-warm: #251d18;

      --text: #f8f1e9;
      --text-soft: #c6b7ac;
      --text-faint: #8e8178;

      --espresso: #100c0a;
      --espresso-soft: #211713;

      --line: rgba(255, 239, 222, 0.08);
      --line-strong: rgba(224, 190, 140, 0.22);

      --botBubble: #201a17;
      --botBorder: rgba(224, 190, 140, 0.16);

      --userBubbleFrom: #9a6848;
      --userBubbleTo: #6f4634;

      --shadow-lg:
        0 36px 100px rgba(0, 0, 0, 0.66),
        0 8px 24px rgba(0, 0, 0, 0.38);

      --shadow-md:
        0 12px 30px rgba(0, 0, 0, 0.25);
    }

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       PAGE
    ========================================================= */

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;

      overflow: hidden;

      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          rgba(24, 15, 11, 0.12),
          rgba(24, 15, 11, 0.32)
        ),
        url("/assets/Hintergrund.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 18% 10%,
          rgba(235, 196, 141, 0.14),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 86%,
          rgba(143, 82, 51, 0.12),
          transparent 40%
        );

      z-index: -1;
    }

    /* =========================================================
       CHAT SHELL
    ========================================================= */

    .chatbox {
      width: 440px;
      max-width: 96vw;

      height: 650px;
      max-height: calc(100dvh - 34px);

      display: flex;
      flex-direction: column;

      position: relative;
      overflow: hidden;

      background: var(--surface);

      border:
        1px solid
        rgba(218, 190, 154, 0.38);

      border-radius: var(--radius-xl);

      box-shadow: var(--shadow-lg);

      animation:
        auraEnter
        0.55s
        cubic-bezier(0.16, 0.8, 0.3, 1)
        both;
    }

    @keyframes auraEnter {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .chat-header {
      flex-shrink: 0;

      position: relative;
      z-index: 4;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 14px;

      padding: 17px 18px 16px;

      color: #fff9f2;

      background:
        radial-gradient(
          circle at 5% 0%,
          rgba(224, 184, 127, 0.18),
          transparent 38%
        ),
        linear-gradient(
          135deg,
          #2e2019 0%,
          #231712 55%,
          #1b120e 100%
        );

      border-bottom:
        1px solid
        rgba(231, 200, 158, 0.14);
    }

    .chat-header::after {
      content: "";
      position: absolute;

      left: 18px;
      right: 18px;
      bottom: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(218, 177, 117, 0.48),
          transparent
        );
    }

    .chat-header-left {
      display: flex;
      align-items: center;

      min-width: 0;

      gap: 12px;
    }

    /* =========================================================
       A.U.R.A. BRAND MARK
    ========================================================= */

    .brand-icon {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(245, 215, 170, 0.96),
          rgba(190, 131, 78, 0.92)
        );

      border:
        1px solid
        rgba(255, 245, 228, 0.68);

      box-shadow:
        0 7px 20px rgba(0, 0, 0, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.58);
    }

    .brand-icon svg {
      width: 21px;
      height: 21px;

      fill: none;

      stroke: #3c261c;
      stroke-width: 1.65;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================================
       IDENTITY
    ========================================================= */

    .identity {
      min-width: 0;
    }

    .assistant-kicker {
      margin-bottom: 4px;

      color: #ddba82;

      font-size: 9px;
      line-height: 1;

      font-weight: 800;

      letter-spacing: 0.13em;

      text-transform: uppercase;
    }

    .chat-title {
      max-width: 245px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      color: #fffaf4;

      font-size: 14px;
      line-height: 1.25;

      font-weight: 750;

      letter-spacing: -0.01em;
    }

    .chat-subtitle {
      margin-top: 3px;

      color: rgba(246, 236, 226, 0.70);

      font-size: 10.5px;
      line-height: 1.25;

      font-weight: 500;
    }

    .assistant-status {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-top: 6px;

      color: rgba(247, 239, 229, 0.84);

      font-size: 9.5px;
      line-height: 1;
    }

    .online-dot {
      width: 6px;
      height: 6px;

      flex: 0 0 6px;

      border-radius: 999px;

      background: #98b68d;

      box-shadow:
        0 0 0 3px
        rgba(152, 182, 141, 0.09);
    }

    /* =========================================================
       THEME BUTTON
    ========================================================= */

    #themeBtn {
      width: 36px;
      height: 36px;

      flex: 0 0 36px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border:
        1px solid
        rgba(255, 243, 226, 0.18);

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.07);

      color: #f4d6a7;

      cursor: pointer;

      font-size: 15px;

      transition:
        background 0.16s ease,
        border-color 0.16s ease,
        transform 0.16s ease;
    }

    #themeBtn:hover {
      transform: translateY(-1px);

      background:
        rgba(255, 255, 255, 0.12);

      border-color:
        rgba(255, 243, 226, 0.30);
    }

    /* =========================================================
       CHAT AREA
    ========================================================= */

    #messages {
      flex: 1;

      min-height: 0;

      display: flex;
      flex-direction: column;

      overflow-y: auto;

      scroll-behavior: smooth;

      padding:
        18px 17px
        20px;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 5%,
          rgba(205, 162, 104, 0.055),
          transparent 26%
        ),
        linear-gradient(
          180deg,
          var(--surface-soft),
          var(--surface)
        );
    }

    :root[data-theme="dark"] #messages {
      background:
        radial-gradient(
          circle at 15% 5%,
          rgba(207, 164, 107, 0.05),
          transparent 27%
        ),
        linear-gradient(
          180deg,
          #191512,
          #14110f
        );
    }

    /* =========================================================
       MESSAGE BASE
    ========================================================= */

    .msg {
      max-width: 88%;

      margin: 6px 0;

      padding:
        12px 14px;

      border-radius:
        17px;

      font-size: 13.5px;
      line-height: 1.56;

      position: relative;

      animation:
        msgIn
        0.26s
        cubic-bezier(0.16, 0.8, 0.3, 1)
        both;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       BOT MESSAGE
    ========================================================= */

    .msg.bot {
      align-self: flex-start;

      color: var(--text);

      background: var(--botBubble);

      border:
        1px solid
        var(--botBorder);

      border-bottom-left-radius: 6px;

      box-shadow:
        0 4px 16px
        rgba(65, 39, 25, 0.055);
    }

    /* =========================================================
       USER MESSAGE
    ========================================================= */

    .msg.user {
      align-self: flex-end;

      color: #fffaf5;

      background:
        linear-gradient(
          140deg,
          var(--userBubbleFrom),
          var(--userBubbleTo)
        );

      border:
        1px solid
        rgba(255, 242, 226, 0.09);

      border-bottom-right-radius: 6px;

      box-shadow:
        0 7px 18px
        rgba(44, 27, 19, 0.14);
    }

    /* =========================================================
       DYNAMIC BUTTON ROWS
    ========================================================= */

    .row {
      display: flex;
      flex-wrap: wrap;

      align-items: center;

      gap: 7px;

      margin-top: 9px;
    }

    /* =========================================================
       ACTION BUTTONS
    ========================================================= */

    .pill,
    .pill.alt {
      min-height: 38px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      padding:
        8px 13px;

      border-radius:
        12px;

      cursor: pointer;

      font-size: 12px;
      line-height: 1.15;

      font-weight: 650;

      white-space: nowrap;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    /* SECONDARY ACTION */

    .pill,
    .pill.alt {
      color: var(--text);

      background: var(--surface);

      border:
        1px solid
        var(--line-strong);

      box-shadow:
        0 3px 10px
        rgba(54, 34, 23, 0.05);
    }

    .pill:hover,
    .pill.alt:hover {
      transform:
        translateY(-1px);

      background:
        var(--surface-warm);

      border-color:
        rgba(171, 113, 66, 0.42);
    }

    /* PRIMARY */

    .pill--primary {
      color: #fffaf3 !important;

      background:
        linear-gradient(
          135deg,
          #4a3228,
          #2c1e18
        ) !important;

      border:
        1px solid
        rgba(255, 239, 220, 0.08) !important;

      box-shadow:
        0 7px 18px
        rgba(43, 27, 19, 0.18) !important;
    }

    .pill--primary:hover {
      background:
        linear-gradient(
          135deg,
          #5a3d30,
          #34231b
        ) !important;
    }

    .pill.active {
      color: #fff8ef;

      background:
        linear-gradient(
          135deg,
          #9f6b43,
          #785039
        );

      border-color:
        transparent;
    }

    /* =========================================================
       SMALL ICONS CREATED BY JS
    ========================================================= */

    .ba-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-right: 3px;

      color: var(--brandDark);

      font-size: 12px;
      line-height: 1;
    }

    .pill--primary .ba-icon {
      color: #e7c48f;
    }

    /* =========================================================
       TAGS / CONFIRMED CHOICES
    ========================================================= */

    .tag {
      display: inline-flex;
      align-items: center;

      gap: 5px;

      max-width: 100%;

      margin-top: 4px;

      padding:
        6px 10px;

      border:
        1px solid
        rgba(167, 111, 68, 0.18);

      border-radius:
        9px;

      background:
        rgba(186, 132, 83, 0.075);

      color: var(--brandDark);

      font-size: 11px;
      line-height: 1.3;

      font-weight: 650;
    }

    :root[data-theme="dark"] .tag {
      background:
        rgba(204, 156, 94, 0.08);

      color:
        #ddb785;

      border-color:
        rgba(220, 180, 125, 0.15);
    }

    /* =========================================================
       SUPPORT TEXT
    ========================================================= */

    .muted-small {
      display: block;

      margin-top: 5px;

      color: var(--text-faint);

      font-size: 11px;
      line-height: 1.5;
    }

    .muted-note {
      margin-top: 7px;

      color: var(--text-faint);

      font-size: 10px;
      line-height: 1.45;
    }

    /* =========================================================
       INPUTS INSIDE CHAT STEPS
    ========================================================= */

    .msg input {
      width: 100%;

      min-height: 42px;

      margin-top: 10px;

      padding:
        10px 12px;

      border:
        1px solid
        var(--line-strong);

      border-radius:
        11px;

      outline: none;

      background:
        var(--surface);

      color:
        var(--text);

      font-size:
        13px;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .msg input:focus {
      border-color:
        rgba(178, 120, 70, 0.65);

      box-shadow:
        0 0 0 3px
        rgba(190, 133, 81, 0.10);
    }

    .msg input::placeholder {
      color:
        var(--text-faint);
    }

    /* =========================================================
       UPSELL
    ========================================================= */

    .upsell-choice {
      display: flex;
      flex-wrap: wrap;

      align-items: center;

      gap: 7px;

      width: 100%;

      padding:
        10px;

      border:
        1px solid
        var(--line);

      border-radius:
        12px;

      background:
        var(--surface-soft);
    }

    .upsell-choice .muted-small {
      flex: 1 1 100%;

      margin:
        0 0 3px;
    }

    /* =========================================================
       TYPING INDICATOR
    ========================================================= */

    .typing {
      min-width: 66px;

      display: flex;
      align-items: center;

      gap: 5px;

      padding:
        12px 14px !important;
    }

    .typing span {
      width: 5px;
      height: 5px;

      border-radius: 999px;

      background:
        var(--brand);

      animation:
        typingBounce
        1.2s
        infinite
        ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.12s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.24s;
    }

    @keyframes typingBounce {
      0%,
      70%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================================================
       DOWNLOAD ACTIONS
    ========================================================= */

    .download-link {
      min-height: 40px;

      display: inline-flex !important;
      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-top: 8px !important;

      padding:
        9px 14px !important;

      border:
        1px solid
        var(--line-strong) !important;

      border-radius:
        11px !important;

      background:
        var(--surface-soft) !important;

      color:
        var(--text) !important;

      text-decoration:
        none !important;

      font-size:
        11.5px !important;

      font-weight:
        650 !important;

      box-shadow:
        none !important;

      transition:
        transform 0.15s ease,
        background 0.15s ease !important;
    }

    .download-link:hover {
      transform:
        translateY(-1px);

      background:
        var(--surface-warm) !important;
    }

    /* =========================================================
       COMPOSER / MESSAGE INPUT
    ========================================================= */

    .chat-input {
      flex-shrink: 0;

      position: relative;
      z-index: 5;

      display: flex;
      align-items: center;

      gap: 8px;

      padding:
        11px 12px
        calc(11px + env(safe-area-inset-bottom));

      background:
        rgba(255, 253, 249, 0.96);

      border-top:
        1px solid
        var(--line);

      box-shadow:
        0 -8px 26px
        rgba(50, 31, 22, 0.035);

      backdrop-filter:
        blur(16px);
    }

    :root[data-theme="dark"] .chat-input {
      background:
        rgba(19, 15, 13, 0.97);
    }

    .chat-input input {
      min-width: 0;
      flex: 1;

      height: 44px;

      padding:
        0 15px;

      border:
        1px solid
        var(--line-strong);

      border-radius:
        14px;

      outline:
        none;

      background:
        var(--surface-soft);

      color:
        var(--text);

      font-size:
        12px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .chat-input input::placeholder {
      color:
        var(--text-faint);
    }

    .chat-input input:focus {
      background:
        var(--surface);

      border-color:
        rgba(180, 122, 72, 0.58);

      box-shadow:
        0 0 0 3px
        rgba(190, 133, 81, 0.08);
    }

    /* =========================================================
       SEND BUTTON
    ========================================================= */

    .chat-input button {
      height: 44px;

      flex: 0 0 auto;

      padding:
        0 17px;

      border:
        1px solid
        rgba(255, 239, 223, 0.07);

      border-radius:
        14px;

      background:
        linear-gradient(
          135deg,
          #4a3228,
          #2d1e18
        );

      color:
        #fffaf4;

      cursor:
        pointer;

      font-size:
        11.5px;

      font-weight:
        750;

      box-shadow:
        0 7px 18px
        rgba(48, 30, 21, 0.15);

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .chat-input button:hover {
      transform:
        translateY(-1px);

      background:
        linear-gradient(
          135deg,
          #5a3c2f,
          #34231b
        );

      box-shadow:
        0 9px 22px
        rgba(48, 30, 21, 0.20);
    }

    .chat-input button:active {
      transform:
        translateY(0);
    }

    /* =========================================================
       LINKS IN BOT MESSAGES
    ========================================================= */

    .msg a:not(.download-link) {
      color:
        var(--brandDark);

      font-weight:
        700;

      text-underline-offset:
        3px;
    }

    /* =========================================================
       SCROLLBAR
    ========================================================= */

    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      border-radius: 999px;

      background:
        rgba(113, 82, 63, 0.18);
    }

    /* =========================================================
       ACCESSIBILITY
    ========================================================= */

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline:
        2px solid
        rgba(199, 151, 91, 0.75);

      outline-offset:
        2px;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 768px) {
      body {
        padding:
          max(8px, env(safe-area-inset-top))
          8px
          max(8px, env(safe-area-inset-bottom));
      }

      .chatbox {
        width: 100%;
        max-width: 100%;

        height:
          calc(
            100dvh -
            16px -
            env(safe-area-inset-top) -
            env(safe-area-inset-bottom)
          );

        max-height: none;

        border-radius: 22px;
      }

      .chat-header {
        padding:
          14px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;

        flex-basis: 40px;
      }

      .chat-title {
        max-width: 210px;

        font-size: 13px;
      }

      .chat-subtitle {
        font-size: 10px;
      }

      .assistant-status {
        font-size: 9px;
      }

      #messages {
        padding:
          14px 12px
          18px;
      }

      .msg {
        max-width: 91%;

        padding:
          11px 12px;

        font-size:
          13px;
      }

      .pill,
      .pill.alt {
        min-height: 42px;

        padding:
          9px 12px;

        font-size:
          11.5px;
      }

      .chat-input {
        padding:
          9px
          9px
          calc(
            9px +
            env(safe-area-inset-bottom)
          );
      }

      .chat-input input {
        height:
          44px;

        padding:
          0 12px;

        font-size:
          12px;
      }

      .chat-input button {
        height:
          44px;

        padding:
          0 14px;
      }
    }

    /* =========================================================
       VERY SMALL DEVICES
    ========================================================= */

    @media (max-width: 390px) {
      .chat-header {
        gap: 8px;
      }

      .brand-icon {
        width: 37px;
        height: 37px;

        flex-basis: 37px;
      }

      .chat-title {
        max-width: 175px;

        font-size: 12.5px;
      }

      .assistant-kicker {
        font-size: 8px;
      }

      #themeBtn {
        width: 34px;
        height: 34px;

        flex-basis: 34px;
      }

      .chat-input button {
        padding:
          0 12px;

        font-size:
          11px;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>
</head>

<body>

  <div class="chatbox">

    <!-- =====================================================
         A.U.R.A. HEADER
    ====================================================== -->

    <header class="chat-header">

      <div class="chat-header-left">

        <span
          class="brand-icon"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
          >
            <path
              d="M12 3.5L18.5 7.3V14.7L12 20.5L5.5 14.7V7.3L12 3.5Z"
            />
            <path
              d="M8.5 9.2L12 6.8L15.5 9.2L12 16.8L8.5 9.2Z"
            />
            <path
              d="M8.5 9.2H15.5"
            />
          </svg>
        </span>

        <div class="identity">

          <div class="assistant-kicker">
            A.U.R.A. · Studio Assistenz
          </div>

          <div
            id="chatTitle"
            class="chat-title"
          >
            GlowSuite AI
          </div>

          <div
            id="chatSubtitle"
            class="chat-subtitle"
          >
            Termine & Studio-Service
          </div>

          <div class="assistant-status">
            <span class="online-dot"></span>
            Online · antwortet sofort
          </div>

        </div>

      </div>

      <button
        id="themeBtn"
        type="button"
        aria-label="Darstellung wechseln"
        title="Darstellung wechseln"
      >
        🌙
      </button>

    </header>


    <!-- =====================================================
         CONVERSATION
    ====================================================== -->

    <main
      id="messages"
      aria-live="polite"
      aria-label="Unterhaltung mit A.U.R.A."
    ></main>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->

    <div class="chat-input">

      <input
        id="userInput"
        type="text"
        autocomplete="off"
        aria-label="Nachricht an A.U.R.A."
        placeholder='Frag A.U.R.A. z. B. „Termin morgen um 17 Uhr“'
      />

      <button
        id="sendBtn"
        type="button"
        aria-label="Nachricht senden"
      >
        Senden
      </button>

    </div>

  </div>

  <!-- Bestehende Widget-Logik bleibt in Phase 1 unangetastet -->
  <script
    type="module"
    src="/widget.js"
  ></script>

</body>

</html>
