<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beauty Agent – Online Termin</title>
  <link rel="stylesheet" href="/fonts/Inter.css" />

  <style>
    :root {
      --bg: #f8f3ec;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #7a7a7a;
      --brand: #c38b5f;
      --brandDark: #b05f4b;
      --accent: #f5ebe2;
      --radius: 20px;

      --botBubble: #fffcf9;
      --botBorder: rgba(206, 183, 150, 0.7);
      --userBubbleFrom: #d4af74;
      --userBubbleTo: #b8795b;
    }

    :root[data-theme="dark"] {
      --bg: #050506;
      --card: #121215;
      --text: #f4f4f4;
      --muted: #a0a0a0;
      --brand: #d4af74;
      --brandDark: #f4b78e;
      --accent: #18181b;

      --botBubble: #18151a;
      --botBorder: rgba(245, 226, 184, 0.38);
      --userBubbleFrom: #d9927c;
      --userBubbleTo: #b8795b;
    }

    /* =========================================================
       BODY – PERFECT PREMIUM BACKGROUND
    ========================================================== */
    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(circle at 50% 45%, rgba(120,80,40,0.08), rgba(0,0,0,0.12)),
        linear-gradient(rgba(18,11,8,0.05), rgba(18,11,8,0.10)),
        url("/assets/Hintergrund.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(circle at 20% 10%, rgba(255, 220, 180, 0.04), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(255, 200, 150, 0.03), transparent 50%);

      mix-blend-mode: soft-light;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(circle at center,
          rgba(255,240,220,0.15) 0%,
          rgba(0,0,0,0.08) 60%,
          rgba(0,0,0,0.18) 100%
        );

      pointer-events: none;
      z-index: -1;
    }

    :root[data-theme="dark"] body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(circle at 30% 0%, rgba(0,0,0,0.45) 0, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(0,0,0,0.75) 0, rgba(0,0,0,0.6) 55%);

      pointer-events: none;
      z-index: -1;
    }

    /* =========================================================
       CHATBOX – FLOATING PREMIUM
    ========================================================== */
    .chatbox {
      width: 440px;
      max-width: 95vw;
      height: 640px;
      background: var(--card);
      border-radius: 26px;
      box-shadow:
        0 40px 100px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.80),
        0 0 60px rgba(255,220,180,0.08) inset;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      backdrop-filter: blur(10px);
      transform-origin: 50% 0;
      animation: chatFloatIn 0.7s cubic-bezier(0.16, 0.8, 0.3, 1) forwards;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chatbox:hover {
      transform: translateY(-2px);
    }

    @keyframes chatFloatIn {
      0%   { opacity: 0; transform: translateY(18px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chatbox::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.35),
        0 0 50px rgba(255,255,255,0.40) inset;
      opacity: .5;
    }

    :root[data-theme="dark"] .chatbox {
      box-shadow:
        0 40px 100px rgba(0,0,0,0.78),
        0 0 0 1px rgba(255,255,255,0.14),
        0 0 60px rgba(255,220,180,0.04) inset;
    }

    /* =========================================================
       HEADER – LUXURY BAR
    ========================================================== */
    .chat-header {
      background: linear-gradient(
        135deg,
        #e6c79c 0%,
        #d4af74 40%,
        #b8795b 100%
      );
      color: white;
      padding: 14px 18px 12px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    :root[data-theme="dark"] .chat-header {
      background: linear-gradient(135deg, #d9927c, #d4af74);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 18px;
      background: radial-gradient(circle at 30% 0%, #ffe9ce, #c46a4b 65%, #8b3b2c 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.7),
        0 8px 20px rgba(0,0,0,.4);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 19px;
      height: 19px;
      stroke: #4b2619;
      stroke-width: 1.6;
      fill: none;
    }

    .chat-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .03em;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }

    .chat-subtitle {
      font-size: 12px;
      opacity: .92;
      margin-top: 2px;
    }

    #themeBtn {
      background: rgba(0,0,0,.20);
      border-radius: 999px;
      border: none;
      color: #ffeede;
      width: 30px;
      height: 30px;
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255,255,255,.25);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    #themeBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.4), 0 4px 10px rgba(0,0,0,0.35);
      background: rgba(0,0,0,0.28);
    }

    :root[data-theme="dark"] #themeBtn {
      background: rgba(0,0,0,0.55);
      color: #ffecd5;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.35);
    }

    /* =========================================================
       MESSAGES – GLASS PANEL
    ========================================================== */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 12px;
      margin: 14px 16px 12px;
      border-radius: 22px;
      border: 1px solid rgba(212,175,115,0.55);
      background:
        linear-gradient(
          rgba(255,255,255,0.92),
          rgba(248,243,236,0.88)
        );
      color: var(--text);
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      box-shadow:
        0 20px 50px rgba(0,0,0,0.12) inset,
        0 0 0 1px rgba(255,255,255,0.70);
    }

    :root[data-theme="dark"] #messages {
      background:
        linear-gradient(
          rgba(28,24,30,0.92),
          rgba(20,16,22,0.88)
        );
      border-color: rgba(245,226,184,0.28);
      box-shadow:
        0 18px 45px rgba(0,0,0,0.52) inset,
        0 0 0 1px rgba(255,255,255,0.10);
    }

    .msg {
      margin: 8px 0;
      padding: 11px 15px;
      border-radius: 14px;
      line-height: 1.5;
      max-width: 92%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      font-size: 14px;
      animation: msgIn 0.35s cubic-bezier(0.16, 0.8, 0.3, 1);
      transform-origin: 0 0;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(4px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.bot {
      background: var(--botBubble);
      border: 1px solid var(--botBorder);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: linear-gradient(135deg, var(--userBubbleFrom), var(--userBubbleTo));
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      border-top-left-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    /* =========================================================
       GOLD-LINE BUTTONS
    ========================================================== */
    .pill,
    .pill.alt {
      background: radial-gradient(circle at 30% 0%, #fff8ea, #d9a057 60%, #8a5320 100%);
      color: #4b2619;
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .01em;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all .18s ease;
      box-shadow:
        0 10px 25px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.5);
      white-space: nowrap;
    }

    .pill--primary {
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.95),
        0 10px 26px rgba(0,0,0,0.38);
      animation: ctaPulse 3.5s ease-in-out infinite;
    }

    @keyframes ctaPulse {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.95), 0 10px 26px rgba(0,0,0,0.38);
      }
      50% {
        transform: translateY(-1px);
        box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 14px 32px rgba(0,0,0,0.45);
      }
    }

    .pill:hover,
    .pill.alt:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.12);
      box-shadow:
        0 14px 35px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.68);
    }

    .pill span.icon {
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(195,139,95,0.12);
      color: var(--brandDark);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      margin-top: 4px;
      border: 1px solid rgba(195,139,95,0.28);
    }

    :root[data-theme="dark"] .tag {
      background: rgba(212,175,115,0.12);
      color: #f5e2b8;
      border-color: rgba(212,175,115,0.4);
    }

    .muted-small {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }

    .muted-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    .msg input {
      width: 100%;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid rgba(210,190,160,0.7);
      font-size: 13px;
      outline: none;
      background: rgba(255,255,255,0.96);
      color: var(--text);
    }

    :root[data-theme="dark"] .msg input {
      background: #141216;
      border-color: rgba(245,226,184,0.4);
      color: #fef6ea;
    }

    .msg input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 1px rgba(212,175,115,0.4);
    }

    /* =========================================================
       INPUT-BEREICH
    ========================================================== */
    .chat-input {
      padding: 10px 12px;
      border-top: 1px solid rgba(0,0,0,0.04);
      background:
        linear-gradient(
          rgba(255,255,255,0.92),
          rgba(248,243,236,0.85)
        );
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
      backdrop-filter: blur(10px);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
    }

    :root[data-theme="dark"] .chat-input {
      background: rgba(12,11,13,0.96);
      border-top-color: rgba(255,255,255,0.08);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.32);
    }

    .chat-input input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(210,190,160,0.8);
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      background: rgba(255,255,255,0.92);
      color: var(--text);
    }

    :root[data-theme="dark"] .chat-input input {
      background: #141216;
      border-color: rgba(245,226,184,0.5);
      color: #fef6ea;
    }

    .chat-input button {
      background: linear-gradient(135deg, #d4af74, #b8795b);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      box-shadow:
        0 6px 18px rgba(180,120,80,0.25),
        inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .chat-input button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow:
        0 8px 22px rgba(180,120,80,0.30),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    :root[data-theme="dark"] .chat-input button {
      background: linear-gradient(135deg, #d9927c, #d4af74);
      box-shadow:
        0 6px 18px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.12);
    }

    /* =========================================================
       TYPING INDICATOR – PREPARED
    ========================================================== */
    .typing {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #c38b5f;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingBounce {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,.18);
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="chatbox">
    <div class="chat-header">
      <div class="chat-header-left">
        <span class="brand-icon">
          <!-- Premium-Gem-Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M4 9L8 3h8l4 6-8 12z" />
            <path d="M4 9h16" />
            <path d="M9 9l3 12" />
            <path d="M15 9l-3 12" />
          </svg>
        </span>
        <div>
          <div id="chatTitle" class="chat-title">GlowSuite AI – Dein Termin Agent</div>
          <div id="chatSubtitle" class="chat-subtitle">Automatische Buchungen & WhatsApp Antworten</div>
        </div>
      </div>
      <button id="themeBtn" aria-label="Theme umschalten">🌙</button>
    </div>

    <div id="messages"></div>

    <div class="chat-input">
      <input id="userInput" placeholder='Schreib z. B. „Termin buchen“ oder frag nach …' />
      <button id="sendBtn">Senden</button>
    </div>
  </div>

  <!-- Widget-Logik bleibt unangetastet -->
  <script type="module" src="/widget.js"></script>
</body>
</html>
