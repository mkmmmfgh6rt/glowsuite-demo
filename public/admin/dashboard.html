<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlowSuite – Dashboard</title>

<link rel="stylesheet" href="/admin/admin.css?v=10.9-pro">
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<header class="app-header">

  <div class="brand">
    <img src="/img/logo-glowsuite.png">

    <div>
      <h1>GlowSuite AI – Admin</h1>
      <div class="small">Autonomous Salon OS</div>
      <div class="small" id="dateToday"></div>
    </div>
  </div>

  <button id="themeToggle" class="icon-btn">
    <i data-lucide="sun-moon"></i>
  </button>

</header>


<main class="container">

<div class="card fade-in">

<h2>Dashboard</h2>
<div class="kpi-grid">

  <div class="kpi">
    <div class="kpi-label">Umsatz</div>
    <div class="kpi-value" id="revenue">–</div>
  </div>

  <div class="kpi">
    <div class="kpi-label">Kunden</div>
    <div class="kpi-value" id="customers">–</div>
  </div>

  <div class="kpi">
    <div class="kpi-label">Termine</div>
    <div class="kpi-value" id="bookings">–</div>
  </div>

</div>

</div>

</main>


<script>

document.addEventListener("DOMContentLoaded", ()=>{

  lucide.createIcons();

  const dateEl = document.getElementById("dateToday");
  if(dateEl){
    dateEl.textContent = new Date().toLocaleDateString("de-DE",{
      weekday:"long",
      day:"2-digit",
      month:"long",
      year:"numeric"
    });
  }

  const saved = localStorage.getItem("theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);

  document.getElementById("themeToggle").onclick = ()=>{
    const root = document.documentElement;
    const next = root.getAttribute("data-theme")==="dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  };

  load();

});


async function load(){

const res = await fetch("/api/dashboard",{
headers:{
"Authorization":"Bearer admin"
}
});

const data = await res.json();
const d = data.data;

document.getElementById("revenue").innerText = d.revenue + " €";
document.getElementById("customers").innerText = d.active;
document.getElementById("bookings").innerText = d.total;

}

</script>

</body>
</html>
